<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="청소년 문화유산해설사 과정 답사 앱. 서울 문화유산 12곳을 지도·체크리스트·한영 해설로 익힙니다. 제작 DYHAN.">
<meta name="author" content="DYHAN">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="한국탐방 해설사">
<meta property="og:description" content="서울 문화유산 12곳, 한국어와 영어로 함께 익히는 청소년 해설사 답사 앱.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한국탐방 해설사">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* 기본 리셋 — 안전영역과 색 구성만 잡고, 나머지는 앱 스타일이 담당한다 */
:root{
  color-scheme: light dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
</style>
<title>한국탐방 해설사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  /* 1색 1역할 — 색이 곧 정보다 */
  --hong:#CD2E3A;        /* 태극 양(陽) — 주 액션, 선택, 미방문 */
  --hong-ink:#A3222C;    /* 낙관을 찍는 눌림 상태 */
  --hong-tint:#FCEBEC;
  --cheong:#0B4DA2;      /* 태극 음(陰) — 영어, 수계 */
  --cheong-tint:#E8EFF9;
  --hwang:#B07716;       /* 오방 중앙 — 추정 */
  --hwang-tint:#FBF0DC;
  --nok:#1F7A5A;         /* 오방 동방 — 완료 */
  --nok-tint:#E4F2EC;

  --bg:#F3F4F6;          /* 오방 서방 — 한지 바탕 */
  --card:#FFFFFF;
  --card-2:#F8F9FB;
  --ink:#14161B;         /* 오방 북방 — 본문 */
  --ink-2:#585F6E;
  --ink-3:#8C93A3;
  --line:rgba(20,22,27,.09);
  --line-2:rgba(20,22,27,.18);
  --bar:rgba(243,244,246,.84);

  /* 조선 목공예의 정갈한 선 — 과하게 둥글리지 않는다 */
  --r-s:6px; --r-m:8px; --r-l:12px;
  --sh-paper:0 4px 12px rgba(20,22,27,.05);
  --sh-lift:0 6px 20px rgba(20,22,27,.09);
  --sh-bar:0 -1px 0 var(--line), 0 -12px 28px -22px rgba(20,22,27,.28);

  --ui:"Gothic A1","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --lat:"Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --hong:#FF5F68; --hong-ink:#FF8A90; --hong-tint:#31171A;
    --cheong:#71A8FF; --cheong-tint:#14213A;
    --hwang:#E8B860; --hwang-tint:#332812;
    --nok:#4FC49B; --nok-tint:#123328;
    --bg:#0E1014; --card:#171A20; --card-2:#1D2128;
    --ink:#EDEFF4; --ink-2:#A3AAB9; --ink-3:#757C8B;
    --line:rgba(237,239,244,.10); --line-2:rgba(237,239,244,.20);
    --bar:rgba(14,16,20,.84);
    --sh-paper:0 2px 8px rgba(0,0,0,.4);
    --sh-lift:0 8px 24px rgba(0,0,0,.6);
    --sh-bar:0 -1px 0 var(--line), 0 -14px 30px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --hong:#FF5F68; --hong-ink:#FF8A90; --hong-tint:#31171A;
  --cheong:#71A8FF; --cheong-tint:#14213A;
  --hwang:#E8B860; --hwang-tint:#332812;
  --nok:#4FC49B; --nok-tint:#123328;
  --bg:#0E1014; --card:#171A20; --card-2:#1D2128;
  --ink:#EDEFF4; --ink-2:#A3AAB9; --ink-3:#757C8B;
  --line:rgba(237,239,244,.10); --line-2:rgba(237,239,244,.20);
  --bar:rgba(14,16,20,.84);
  --sh-paper:0 2px 8px rgba(0,0,0,.4);
  --sh-lift:0 8px 24px rgba(0,0,0,.6);
  --sh-bar:0 -1px 0 var(--line), 0 -14px 30px -22px rgba(0,0,0,.9);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:900; letter-spacing:-.02em; line-height:1.26; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:var(--cheong); text-decoration:none}
:focus-visible{outline:2px solid var(--hong); outline-offset:2px; border-radius:4px}
.num{font-family:var(--lat); font-variant-numeric:tabular-nums}
.cap{font-family:var(--lat); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

/* ===== 살창(격자창) 구획선 — 회색 선 대신 창살 텍스처 ===== */
.lattice{
  height:9px; margin:0 2px;
  background-image:
    repeating-linear-gradient(90deg, var(--line-2) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(0deg, var(--line-2) 0 1px, transparent 1px 11px);
  background-position:0 0;
}

/* ===== 앱 셸 ===== */
.app{max-width:520px; margin:0 auto; min-height:100%; position:relative; background:var(--bg)}
@media (min-width:640px){ body{background:var(--card-2)} .app{box-shadow:0 0 0 1px var(--line); background:var(--bg)} }

.appbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
  background:var(--bar); backdrop-filter:blur(14px) saturate(1.6);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; padding:10px 14px; min-height:54px;
}
.appbar .back{width:34px; height:34px; display:grid; place-items:center; margin-left:-6px; border-radius:50%}
.appbar .back:active{background:var(--line-2)}
.appbar .ttl{font-weight:900; font-size:17px; letter-spacing:-.02em; margin-right:auto; display:flex; align-items:baseline; gap:7px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.appbar .ttl small{font-family:var(--lat); font-weight:600; font-size:11px; color:var(--ink-3); letter-spacing:.02em}

.langpill{display:flex; background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-m); padding:2px; gap:2px; flex:none}
.langpill button{font-family:var(--lat); font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:var(--r-s); color:var(--ink-2); white-space:nowrap; transition:background .14s}
.langpill button[aria-pressed="true"]{background:var(--hong); color:#fff}

.view{padding:22px 16px 118px}
@media (prefers-reduced-motion: no-preference){
  .view{animation:rise .26s cubic-bezier(.22,.8,.3,1)}
  @keyframes rise{from{opacity:.4; transform:translateY(6px)} to{opacity:1; transform:none}}
}

/* ===== 하단 탭 ===== */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--bar); backdrop-filter:blur(14px) saturate(1.6); box-shadow:var(--sh-bar);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabbar-in{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
.tabbar button{display:grid; justify-items:center; gap:3px; padding:6px 0 4px; color:var(--ink-3)}
.tabbar button svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tabbar button span{font-size:10.5px; font-weight:700}
.tabbar button[aria-current="true"]{color:var(--hong)}
.tabbar button[aria-current="true"] svg{stroke-width:2.1}

/* ===== 카드 — 한지 위에 떠 있는 종이 ===== */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--sh-paper)}
.sect{margin-top:30px}
.sect-hd{display:flex; align-items:center; gap:9px; margin-bottom:12px; padding:0 2px}
.sect-hd h2{font-size:15.5px}
.sect-hd .n{font-family:var(--lat); font-size:11px; font-weight:600; color:var(--ink-3); margin-left:auto}

.chip{display:inline-flex; align-items:center; gap:4px; font-family:var(--lat); font-size:10px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border-radius:var(--r-s); white-space:nowrap}
.chip.ok{background:var(--nok-tint); color:var(--nok)}
.chip.est{background:var(--hwang-tint); color:var(--hwang)}
.chip.en{background:var(--cheong-tint); color:var(--cheong)}
.chip.ko{background:var(--hong-tint); color:var(--hong)}

/* ===== 괘 표식 ===== */
.gwae{width:17px; height:15px; flex:none}
.gwae rect{fill:currentColor}

/* ===== 유형 필터 / 지도 필터 ===== */
.filters{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 4px; margin:0 -2px 14px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-m);
  padding:7px 11px; font-size:12.5px; font-weight:700; color:var(--ink-2); transition:background .14s, border-color .14s, color .14s;
}
.fbtn .c{font-family:var(--lat); font-size:10.5px; font-weight:600; color:var(--ink-3)}
.fbtn[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--card)}
.fbtn[aria-pressed="true"] .c{color:var(--card); opacity:.65}
.fbtn.g[aria-pressed="true"]{background:var(--hong); border-color:var(--hong); color:#fff}
.fbtn.k[aria-pressed="true"]{background:var(--nok); border-color:var(--nok); color:#fff}

/* ===== 진도 — 단청 색동이 채워지는 게이지 ===== */
.dan{
  background-image:repeating-linear-gradient(90deg,
    var(--hong) 0 9px, var(--hwang) 9px 18px, var(--nok) 18px 27px, var(--cheong) 27px 36px);
}
.tk{display:block; overflow:hidden}
.fl{display:block; height:100%}
.ring{position:relative; flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--lat); font-size:11px; font-weight:700}

/* 한·영 병기 */
.bi{display:grid; gap:7px}
.bi .r{display:grid; grid-template-columns:20px 1fr; gap:8px; align-items:start}
.bi .tg{font-family:var(--lat); font-size:9px; font-weight:700; letter-spacing:.08em; color:var(--ink-3); padding-top:4px}
.bi .r.e .x{color:var(--cheong)}
.bi .x{line-height:1.66}

/* ===== 홈 ===== */
.hero{padding:2px 2px 4px}
.hero .kicker{display:flex; align-items:center; gap:7px}
.hero .flagdot{width:11px; height:11px; border-radius:50%; background:var(--hong); box-shadow:0 0 0 3px var(--hong-tint); flex:none}
.hero h1{font-size:clamp(24px,7vw,31px); margin-top:13px}
.hero p{margin-top:10px; color:var(--ink-2); font-size:14px}
.statrow{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:18px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:12px 13px; box-shadow:var(--sh-paper)}
.stat b{display:block; font-family:var(--lat); font-size:21px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
.stat span{display:block; font-size:11px; color:var(--ink-3); margin-top:3px; font-weight:500}

.mapcard{margin-top:18px; padding:10px; overflow:hidden}
.mapcard svg.mp{display:block; width:100%; height:auto}
.maplg{display:flex; flex-wrap:wrap; gap:5px 13px; padding:8px 6px 4px}
.maplg span{display:inline-flex; align-items:center; gap:5px; font-family:var(--lat); font-size:10px; font-weight:600; color:var(--ink-3); letter-spacing:.05em}
.maplg i{width:8px; height:8px; border-radius:50%; flex:none}
.mapnote{padding:2px 6px 4px; font-size:11.5px; color:var(--ink-3); line-height:1.5}

.pin{cursor:pointer; transition:opacity .2s}
.pin .d{fill:var(--card); stroke:var(--hong); stroke-width:2.4}
.pin text{font-family:var(--lat); font-size:19px; font-weight:700; fill:var(--hong); text-anchor:middle; dominant-baseline:central; pointer-events:none}
.pin.on .d{fill:var(--hong); stroke:var(--card); stroke-width:3.6}
.pin.on text{fill:#fff}
.pin.done .d{stroke:var(--nok); fill:var(--nok)}
.pin.done text{fill:#fff}
.pin.dim{opacity:.18}
.pinlab{font-family:var(--ui); font-size:17px; font-weight:700; fill:var(--ink); paint-order:stroke; stroke:var(--card); stroke-width:6px; stroke-linejoin:round; pointer-events:none}
.geo{font-family:var(--lat); font-size:15px; font-weight:600; letter-spacing:.14em; fill:var(--ink-3); pointer-events:none}

/* ===== 목록 ===== */
.slist{display:grid; gap:8px}
.srow{
  display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:12px;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-m);
  padding:13px 14px; box-shadow:var(--sh-paper); text-align:left; width:100%; min-height:64px;
  transition:transform .09s, box-shadow .14s;
}
.srow:active{transform:scale(.988); box-shadow:none}
.srow .no{font-family:var(--lat); font-size:13px; font-weight:700; color:var(--hong); background:var(--hong-tint); border-radius:var(--r-s); width:40px; height:40px; display:grid; place-items:center}
.srow.done .no{color:var(--nok); background:var(--nok-tint)}
.srow .tx{min-width:0}
.srow .tx b{display:block; font-size:15.5px; font-weight:700; letter-spacing:-.01em}
.srow .tx .meta{display:flex; align-items:center; gap:6px; margin-top:2px; color:var(--ink-3)}
.srow .tx .meta em{font-style:normal; font-family:var(--lat); font-size:11px; font-weight:600; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.srow .rt{display:flex; align-items:center; gap:8px; color:var(--ink-3)}
.srow .rt .pg{font-family:var(--lat); font-size:11px; font-weight:600}
.srow .rt svg{width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2}

/* ===== 답사지 상세 — 처마 단청 머리띠 ===== */
.eave{position:relative; margin:-22px -16px 0; overflow:hidden}
.eave svg{display:block; width:100%; height:auto}
.eave .lbl{
  position:absolute; left:16px; top:20px; display:flex; align-items:center; gap:7px;
  color:var(--ink-2); font-size:12px; font-weight:700; letter-spacing:.01em;
}
.shd{padding:18px 2px 0}
.shd .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.shd .badge{font-family:var(--lat); font-size:11px; font-weight:700; letter-spacing:.06em; color:#fff; background:var(--hong); padding:4px 9px; border-radius:var(--r-s)}
.shd.fin .badge{background:var(--nok)}
.shd h1{font-size:clamp(23px,6.5vw,29px); margin-top:13px}
.shd .sub{font-family:var(--lat); font-size:13.5px; font-weight:600; color:var(--cheong); margin-top:4px}
.shd .addr{margin-top:13px; color:var(--ink-2); font-size:13.5px}
.gobtns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:15px}
.gobtn{display:flex; align-items:center; justify-content:center; gap:7px; background:var(--card); border:1px solid var(--line-2); border-radius:var(--r-m); padding:12px; font-size:13.5px; font-weight:700; color:var(--ink); transition:transform .09s}
.gobtn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.gobtn:active{transform:scale(.985); background:var(--card-2)}

/* 체크 — 완료 시 녹색 취소선과 배경 */
.checkrow{
  display:grid; grid-template-columns:24px 1fr; gap:12px; align-items:start; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:14px;
  box-shadow:var(--sh-paper); min-height:58px; transition:background .18s, border-color .18s, transform .09s;
}
.checkrow + .checkrow{margin-top:8px}
.checkrow:active{transform:scale(.99)}
.checkrow .bx{width:23px; height:23px; border-radius:var(--r-s); border:2px solid var(--line-2); display:grid; place-items:center; margin-top:1px; flex:none; transition:background .16s, border-color .16s}
.checkrow .bx svg{width:13px; height:13px; stroke:#fff; fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .16s}
.checkrow.on{background:var(--nok-tint); border-color:transparent; box-shadow:none}
.checkrow.on .bx{background:var(--nok); border-color:var(--nok)}
.checkrow.on .bx svg{opacity:1}
.checkrow.on .cx .x{text-decoration:line-through; text-decoration-color:var(--nok); text-decoration-thickness:1.5px; color:var(--ink-3)}
.cx{font-size:14px}

.pt{background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:15px; box-shadow:var(--sh-paper); transition:background .18s, border-color .18s}
.pt + .pt{margin-top:8px}
.pt.done{background:var(--nok-tint); border-color:transparent; box-shadow:none}
.pt .ph{display:flex; align-items:flex-start; gap:9px}
.pt h3{font-size:15.5px; flex:1}
.pt h3 .pe{display:block; font-family:var(--lat); font-size:12.5px; font-weight:600; color:var(--cheong); margin-top:3px; letter-spacing:0}
.pt .pb{margin-top:10px; font-size:14px}

.info{background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:15px; box-shadow:var(--sh-paper); font-size:14px}
.info .lb{margin-bottom:8px}

.flist{background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--sh-paper); overflow:hidden}
.frow{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:12px 14px; border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow b{font-size:14px; font-weight:700}
.frow .ad{font-size:12px; color:var(--ink-3); grid-column:1/-1}
.frow .tg{font-size:11.5px; color:var(--ink-2); text-align:right; white-space:nowrap}

.note{font-size:12.5px; color:var(--ink-2); background:var(--hwang-tint); border-left:2px solid var(--hwang); border-radius:0 var(--r-s) var(--r-s) 0; padding:10px 12px; margin-bottom:11px; line-height:1.55}
.src-note{font-size:12px; color:var(--ink-3); line-height:1.6; padding:0 4px}

/* ===== 연습 ===== */
.qcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:22px 20px; box-shadow:var(--sh-lift); min-height:232px; display:flex; flex-direction:column}
.qcard .src{display:flex; align-items:center; gap:8px; margin-bottom:14px}
.qcard .src .s1{font-family:var(--lat); font-size:11px; font-weight:700; color:var(--hong)}
.qcard .src .s2{font-size:11.5px; color:var(--ink-3); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qcard .src .ct{margin-left:auto; font-family:var(--lat); font-size:11px; font-weight:600; color:var(--ink-3)}
.qcard .q{font-size:clamp(20px,5.6vw,25px); font-weight:900; letter-spacing:-.02em; line-height:1.3}
.qcard .qe{font-family:var(--lat); font-size:14px; font-weight:600; color:var(--cheong); margin-top:7px}
.qcard .hint{margin-top:auto; padding-top:18px; font-size:12.5px; color:var(--ink-3)}
.qcard .ans{margin-top:16px; padding-top:16px; border-top:1px dashed var(--line-2); font-size:14px}
.acts{display:grid; gap:8px; margin-top:14px}
.acts.two{grid-template-columns:1fr 1fr}
.bigbtn{border-radius:var(--r-m); padding:14px; font-size:15px; font-weight:800; letter-spacing:-.01em; min-height:50px; transition:transform .08s, background .14s}

.bigbtn.p{background:var(--hong); color:#fff}
.bigbtn.p:active{background:var(--hong-ink)}
.bigbtn.s{background:var(--card); border:1px solid var(--line-2); color:var(--ink)}
.bigbtn.s:active{background:var(--card-2)}
.bigbtn.g{background:var(--nok); color:#fff}
.scopeseg{display:flex; background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:3px; gap:3px; margin-bottom:14px}
.scopeseg button{flex:1; font-size:12.5px; font-weight:700; padding:8px; border-radius:var(--r-s); color:var(--ink-2); transition:background .14s}
.scopeseg button[aria-pressed="true"]{background:var(--ink); color:var(--card)}

/* ===== 내 진도 ===== */
.bigring{display:flex; gap:18px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:18px; box-shadow:var(--sh-paper)}
.bigring .tx b{display:block; font-size:16px}
.bigring .tx span{display:block; font-size:12.5px; color:var(--ink-2); margin-top:3px}
.pbar{display:grid; grid-template-columns:30px 1fr 42px; gap:10px; align-items:center; padding:7px 0}
.pbar .l{font-family:var(--lat); font-size:11px; font-weight:600; color:var(--ink-3)}
.pbar .tk{height:7px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pbar .tk{background:#22262F}}
:root[data-theme="dark"] .pbar .tk{background:#22262F}
.pbar .fl{height:100%; transition:width .4s cubic-bezier(.22,.8,.3,1)}
.pbar .v{font-family:var(--lat); font-size:11px; font-weight:600; color:var(--ink-3); text-align:right}

.maker{background:var(--card); border:1px solid var(--line); border-radius:var(--r-l); padding:22px; box-shadow:var(--sh-paper); text-align:center}
.maker .seal{display:inline-grid; place-items:center; width:58px; height:58px; border:2px solid var(--hong); border-radius:var(--r-s); margin-bottom:12px}
.maker .seal span{font-size:11px; font-weight:900; color:var(--hong); line-height:1.15; letter-spacing:.04em}
.maker .mark{font-family:var(--lat); font-size:26px; font-weight:700; letter-spacing:.2em; padding-left:.2em; display:block}
.maker .role{font-size:12px; color:var(--ink-3); margin-top:6px; font-weight:500}
.maker .ver{display:inline-block; margin-top:12px; font-family:var(--lat); font-size:11px; font-weight:600; color:var(--ink-2); background:var(--card-2); border:1px solid var(--line); padding:4px 10px; border-radius:var(--r-s)}

.linkrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:14px; box-shadow:var(--sh-paper); font-size:14px; font-weight:600; transition:transform .09s}
.linkrow + .linkrow{margin-top:8px}
.linkrow:active{transform:scale(.99)}
.linkrow svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--ink-3)}
.linkrow .ar{margin-left:auto; color:var(--ink-3)}
.linkrow.warn{color:var(--hong)}
.sw{margin-left:auto; width:42px; height:25px; border-radius:99px; background:var(--line-2); position:relative; flex:none; transition:background .18s}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s}
.linkrow[aria-pressed="true"] .sw{background:var(--nok)}
.linkrow[aria-pressed="true"] .sw::after{transform:translateX(17px)}

.hist{position:relative; padding-left:20px}
.hist::before{content:""; position:absolute; left:4px; top:8px; bottom:8px; width:2px; background:var(--line-2)}
.hitem{position:relative; padding:9px 0}
.hitem::before{content:""; position:absolute; left:-20px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--card); border:2px solid var(--line-2)}
.hitem.now::before{background:var(--hong); border-color:var(--hong)}
.hitem .hv{font-family:var(--lat); font-size:12px; font-weight:700; color:var(--hong)}
.hitem .hd{font-family:var(--lat); font-size:10.5px; font-weight:600; color:var(--ink-3); margin-left:7px}
.hitem .hb{font-size:13.5px; color:var(--ink-2); margin-top:3px}

/* ===== 바텀 시트 — 지도에서 답사지 미리보기 ===== */
.sheetwrap{position:fixed; inset:0; z-index:60}
.sheetbg{position:absolute; inset:0; background:rgba(20,22,27,.42); opacity:0; transition:opacity .22s}
.sheetwrap.in .sheetbg{opacity:1}
.sheet{
  position:absolute; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
  background:var(--card); border-top:1px solid var(--line);
  border-radius:var(--r-l) var(--r-l) 0 0; box-shadow:var(--sh-lift);
  padding:8px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  transform:translateY(102%); transition:transform .26s cubic-bezier(.22,.8,.3,1);
}
.sheetwrap.in .sheet{transform:none}
.sheet .grip{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:0 auto 14px}
.sheet .sh-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sheet h3{font-size:20px; margin-top:11px}
.sheet .sh-en{font-family:var(--lat); font-size:12.5px; font-weight:600; color:var(--cheong); margin-top:3px}
.sheet .sh-ad{font-size:12.5px; color:var(--ink-2); margin-top:9px}
.sheet .sh-pg{display:flex; align-items:center; gap:9px; margin-top:13px}
.sheet .sh-pg .tk{flex:1; height:7px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-s); overflow:hidden}
.sheet .sh-pg .fl{height:100%}
.sheet .sh-pg .v{font-family:var(--lat); font-size:11px; font-weight:600; color:var(--ink-3)}
.sheet .sh-acts{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
@media (prefers-reduced-motion: reduce){.sheetbg,.sheet{transition:none}}

/* ===== 낙관 스탬프 — 답사지 체크를 다 채웠을 때 ===== */
.stamp{position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; background:rgba(20,22,27,.16)}
.stamp .sl{
  width:132px; height:132px; border:4px solid var(--hong); border-radius:10px;
  background:var(--card); display:grid; grid-template-columns:1fr 1fr; align-content:center;
  place-items:center; gap:2px; padding:12px; box-shadow:0 10px 40px rgba(205,46,58,.35);
}
.stamp .sl i{font-style:normal; font-size:31px; font-weight:900; color:var(--hong); line-height:1}
.stamp .cap2{margin-top:14px; font-size:13px; font-weight:700; color:#fff; background:var(--hong); padding:5px 13px; border-radius:99px; text-align:center}
.stamp .inner{display:grid; justify-items:center; animation:seal .62s cubic-bezier(.2,1.5,.4,1) both}
@keyframes seal{
  0%{opacity:0; transform:scale(2.1) rotate(-13deg)}
  55%{opacity:1; transform:scale(.94) rotate(-4deg)}
  75%{transform:scale(1.03) rotate(-6deg)}
  100%{opacity:1; transform:scale(1) rotate(-5deg)}
}
@media (prefers-reduced-motion: reduce){.stamp .inner{animation:none}}
.stamp.out{opacity:0; transition:opacity .3s}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .view{padding:20px 16px 118px}
  .appbar{padding:9px 14px}
  .qcard{padding:20px 17px}
}
</style>

/* 괘 표식 — 이어진 획은 양, 끊긴 획은 음 */
function gwaeSvg(bars){
  const rows = bars.map((b,i) => {
    const y = i * 5.5;
    return b
      ? `<rect x="0" y="${y}" width="17" height="3" rx="1"></rect>`
      : `<rect x="0" y="${y}" width="7" height="3" rx="1"></rect><rect x="10" y="${y}" width="7" height="3" rx="1"></rect>`;
  }).join("");
  return `<svg class="gwae" viewBox="0 0 17 14.5" aria-hidden="true">${rows}</svg>`;
}

/* ---------------- 단청 진도 게이지 ---------------- */
function danBar(done, total, h){
  const p = total ? done / total * 100 : 0;
  return `<span class="tk" style="${h ? "height:" + h + "px" : ""}"><span class="fl dan" style="width:${p}%"></span></span>`;
}
function ring(done, total, size){
  const r = (size - 7) / 2, c = 2 * Math.PI * r, p = total ? done / total : 0;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" aria-hidden="true">
      <defs><linearGradient id="dg${size}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="var(--hong)"/><stop offset="34%" stop-color="var(--hwang)"/>
        <stop offset="67%" stop-color="var(--nok)"/><stop offset="100%" stop-color="var(--cheong)"/>
      </linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="6"></circle>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#dg${size})" stroke-width="6"
        stroke-linecap="butt" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"></circle>
    </svg><span class="t">${Math.round(p*100)}<small style="font-size:.66em">%</small></span></div>`;
}

/* ---------------- 처마 단청 머리띠 ----------------
   사진을 쓸 수 없으므로 막새기와 처마선과 단청 색동을 직접 그린다.
   띠의 색 구성이 답사지 유형을 나타낸다 — 장식이 아니라 표시다. */
function eaveSvg(s){
  const c = catOf(s), [a, b] = c.tone.map(v => `var(${v})`);
  const W = 400, H = 56, tiles = [];
  for(let x = 0; x <= W; x += 20){
    tiles.push(`<path d="M${x} ${H} a10 10 0 0 1 20 0z" fill="${(x/20) % 2 ? a : b}"></path>`);
  }
  return `<div class="eave"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <rect width="${W}" height="${H}" fill="var(--card-2)"></rect>
      <rect width="${W}" height="8" fill="${a}"></rect>
      <rect y="8" width="${W}" height="2.5" fill="${b}"></rect>
      <rect y="13" width="${W}" height="1.5" fill="${a}" opacity=".45"></rect>
      <rect y="${H-13}" width="${W}" height="1.5" fill="${b}" opacity=".45"></rect>
      ${tiles.join("")}
    </svg>
    <span class="lbl">${gwaeSvg(c.bars)}${esc(c.gwae)} · ${esc(P(c.ko, c.en))}</span>
  </div>`;
}

/* ---------------- 낙관 스탬프 + 소리 ---------------- */
let actx = null;
function pluck(){
  if(!st.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    // 5음 음계에서 두 음을 짧게 — 현을 튕긴 감촉을 배음 감쇠로 흉내낸다
    [392.00, 587.33].forEach((f, k) => {
      const t0 = actx.currentTime + k * 0.14;
      [1, 2, 3.02, 4.15].forEach((m, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f * m;
        const peak = 0.20 / (i + 1.6);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(peak, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1 / (i * 0.7 + 1));
        o.connect(g); g.connect(actx.destination);
        o.start(t0); o.stop(t0 + 1.3);
      });
    });
  }catch(e){ /* 소리를 못 내도 앱은 그대로 동작한다 */ }
}
let stampTimer = null;
function showStamp(){
  const el = document.getElementById("stamp");
  const seal = P("답사완료", "DONE").split("");
  el.innerHTML = `<div class="inner">
      <div class="sl">${seal.map(ch => `<i>${esc(ch)}</i>`).join("")}</div>
      <div class="cap2">${esc(L("sealDone"))}</div>
    </div>`;
  el.hidden = false; el.classList.remove("out");
  try{ if(navigator.vibrate) navigator.vibrate([14, 40, 22]); }catch(e){}
  pluck();
  clearTimeout(stampTimer);
  stampTimer = setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => { el.hidden = true; el.classList.remove("out"); }, 320);
  }, 1150);
}

  const shown = s => st.filt === "all" || (st.filt === "done") === isFin(s);
  const pins = SITES.map(s => {
    const x = X(s.lng), y = Y(s.lat), on = s.no === st.sel, dn = isFin(s);

      <ellipse cx="460" cy="419" rx="96" ry="55" transform="rotate(-8 460 419)"></ellipse>
      <ellipse cx="598" cy="169" rx="40" ry="53"></ellipse>
    </g>
    <path d="M 0,532 Q 130,563 255,600 Q 370,647 473,686 Q 640,675 800,660 L 800,743 Q 640,758 473,768 Q 370,730 255,682 Q 130,647 0,614 Z"
      fill="var(--cheong)" opacity=".17"></path>
    <path d="M 407,38 C 330,75 275,124 240,180 C 272,246 320,302 366,344 C 400,384 430,409 460,419
             C 522,403 582,349 611,294 C 616,244 605,201 596,172 C 592,131 590,109 589,90

    <text class="geo" x="26" y="700">${esc(P("한강","HAN RIVER"))}</text>

    <line x1="${sp.x.toFixed(1)}" y1="${sp.y.toFixed(1)}" x2="${cp.x.toFixed(1)}" y2="${cp.y.toFixed(1)}"

let deck = [], di = 0, opened = false;
function buildDeck(){
  const pool = st.scope === "site" ? POINTS.filter(p => p.no === st.sel) : POINTS;
  deck = pool.slice();
  for(let i = deck.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  di = 0; opened = false;
}
function vDrill(){
  if(!deck.length) buildDeck();
  const p = deck[di];
  const seg = `<div class="scopeseg" id="scopeSeg">
      <button type="button" data-scope="all" aria-pressed="${st.scope === "all"}">${esc(L("scopeAll"))}</button>
      <button type="button" data-scope="site" aria-pressed="${st.scope === "site"}">${esc(L("scopeOne"))}</button>
    </div>`;
  if(!p) return seg + `<div class="qcard"><p>${esc(L("shuffleAgain"))}</p>
    <div class="acts"><button class="bigbtn p" type="button" id="dShuffle">${esc(L("shuffleAgain"))}</button></div></div>`;
  return seg + `<div class="qcard">
      <div class="src"><span class="s1">${String(p.no).padStart(2,"0")}</span>
        <span class="s2">${esc(P(p.sko, p.sen))}</span>
        ${st.known[p.id] ? `<span class="chip ok">${esc(L("learned"))}</span>` : ""}
        <span class="ct">${di + 1} / ${deck.length}</span></div>
      <div class="q">${esc(st.lang === "en" ? p.ten : p.tko)}</div>
      ${st.lang === "both" ? `<div class="qe">${esc(p.ten)}</div>` : ""}
      ${opened
        ? `<div class="ans"><div class="cap" style="margin-bottom:9px">${esc(L("bothNote"))}</div>
            <span class="bi"><span class="r"><span class="tg">KO</span><span class="x">${esc(p.ko)}</span></span>
            <span class="r e"><span class="tg">EN</span><span class="x">${esc(p.en)}</span></span></span></div>`
        : `<p class="hint">${esc(L("think"))}</p>`}
    </div>
    ${opened
      ? `<div class="acts two"><button class="bigbtn g" type="button" id="dGot">${esc(L("got"))}</button>
          <button class="bigbtn s" type="button" id="dAgain">${esc(L("again"))}</button></div>`
      : `<div class="acts"><button class="bigbtn p" type="button" id="dShow">${esc(L("show"))}</button>
          <button class="bigbtn s" type="button" id="dNext">${esc(L("next"))}</button></div>`}`;
}

    </div>

    <div class="sect">
      <button class="linkrow" type="button" id="soundBtn" aria-pressed="${st.sound}">${svg(ICO.bell)}<span>${esc(L("sound"))}</span><span class="sw"></span></button>
      <p class="src-note" style="margin-top:8px">${esc(L("soundHow"))}</p>
      <div class="linkrow" style="margin-top:14px">${svg(ICO.phone)}<span>${esc(L("install"))}</span></div>
      <p class="src-note" style="margin-top:8px">${esc(L("installHow"))}</p>
      <a class="linkrow" href="${REPO}" target="_blank" rel="noopener" style="color:var(--ink); margin-top:14px">
        ${svg(ICO.code)}<span>${esc(L("repo"))}</span><span class="ar">${svg(ICO.chev)}</span></a>
    </div>

    <div class="sect">
      <button class="linkrow warn" type="button" id="resetBtn">${svg(ICO.trash)}<span>${esc(L("reset"))}</span></button>
      <p class="src-note" style="margin-top:14px">${esc(L("source"))}</p>
    </div>`;
}

/* ---------------- 바텀 시트 ---------------- */
function openSheet(no){
  st.sel = no; save();
  const s = site(), c = catOf(s), d = chkDone(s);
  document.getElementById("sheet").innerHTML = `<div class="grip"></div>
    <div class="sh-top"><span class="chip ko" style="font-size:11px">${String(s.no).padStart(2,"0")}</span>
      <span class="chip ${isFin(s) ? "ok" : "en"}" style="display:inline-flex; gap:5px">${gwaeSvg(c.bars)}${esc(P(c.ko, c.en))}</span></div>
    <h3>${esc(P(s.ko, s.en))}</h3>
    <div class="sh-en">${esc(st.lang === "en" ? s.ko : s.en)}</div>
    <p class="sh-ad">${esc(P(s.addr, s.addrEn))}</p>
    <div class="sh-pg">${danBar(d, s.see.length)}<span class="v">${d}/${s.see.length} ${esc(P("체크","checked"))}</span></div>
    <div class="sh-acts">
      <a class="bigbtn s" style="display:flex; align-items:center; justify-content:center"
         href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.ko + " " + s.addr)}" target="_blank" rel="noopener">${esc(L("gmap"))}</a>
      <button class="bigbtn p" type="button" id="sheetGo">${esc(L("detail"))}</button>
    </div>`;
  const w = document.getElementById("sheetWrap");
  w.hidden = false;
  requestAnimationFrame(() => w.classList.add("in"));
  document.getElementById("sheetGo").addEventListener("click", () => { closeSheet(); go("site"); });
  refreshMapSvg();
}
function closeSheet(){
  const w = document.getElementById("sheetWrap");
  w.classList.remove("in");
  setTimeout(() => { w.hidden = true; }, 240);
}
function refreshMapSvg(){
  const old = document.querySelector(".mapcard svg.mp");
  if(!old) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = mapSvg();
  old.replaceWith(tmp.firstElementChild);
  wireMap();
}

/* ---------------- 렌더 ---------------- */
function titleFor(){
  if(st.view === "site") return `${esc(P(site().ko, site().en))}<small>${String(site().no).padStart(2,"0")}</small>`;
  if(st.view === "list") return esc(L("list"));
  if(st.view === "drill") return esc(L("drill"));
  if(st.view === "me") return esc(L("me"));
  return `${esc(T.appName[st.lang === "en" ? "en" : "ko"])}<small>DYHAN</small>`;
}
function render(){
  document.getElementById("barTitle").innerHTML = titleFor();
  document.getElementById("backBtn").hidden = st.view !== "site";
  document.querySelectorAll("#langPill button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === st.lang));
  const tabFor = st.view === "site" ? "list" : st.view;
  document.querySelectorAll("#tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.view === tabFor));
  document.getElementById("view").innerHTML =
    st.view === "list" ? vList() : st.view === "site" ? vSite()
    : st.view === "drill" ? vDrill() : st.view === "me" ? vMe() : vMap();
  wire();
}
function go(view, keep){
  st.view = view; save(); render();
  if(!keep) window.scrollTo({top:0, behavior:"instant"});
}
function wireMap(){
  document.querySelectorAll(".pin").forEach(g => {
    const no = +g.dataset.no, act = () => openSheet(no);
    g.addEventListener("click", act);
    g.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); act(); } });
  });
}
function wire(){
  wireMap();
  document.querySelectorAll("#mapFilt button").forEach(b =>
    b.addEventListener("click", () => { st.filt = b.dataset.filt; save(); render(); }));
  document.querySelectorAll("#catFilt button").forEach(b =>
    b.addEventListener("click", () => { st.cat = b.dataset.cat; save(); render(); }));
  document.querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => { st.sel = +b.dataset.go; go("site"); }));
  document.querySelectorAll("[data-chk]").forEach(b =>
    b.addEventListener("click", () => {
      const id = b.dataset.chk, s = site(), was = isFin(s);
      if(st.checks[id]) delete st.checks[id]; else st.checks[id] = true;
      save();
      const y = window.scrollY; render(); window.scrollTo({top:y, behavior:"instant"});
      if(!was && isFin(s)) showStamp();
    }));
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener("click", fn); };
  on("dShow", () => { opened = true; render(); });
  on("dNext", () => { di = (di + 1) % deck.length; opened = false; render(); });
  on("dShuffle", () => { buildDeck(); render(); });
  on("dGot", () => { st.known[deck[di].id] = true; save(); di = (di + 1) % deck.length; opened = false; render(); });
  on("dAgain", () => { delete st.known[deck[di].id]; save(); di = (di + 1) % deck.length; opened = false; render(); });
  document.querySelectorAll("#scopeSeg button").forEach(b =>
    b.addEventListener("click", () => { st.scope = b.dataset.scope; save(); buildDeck(); render(); }));
  on("soundBtn", () => { st.sound = !st.sound; save(); render(); if(st.sound) pluck(); });
  on("resetBtn", () => { if(confirm(L("resetAsk"))){ st.checks = {}; st.known = {}; save(); render(); } });
}

document.querySelectorAll("#langPill button").forEach(b =>
  b.addEventListener("click", () => { st.lang = b.dataset.lang; save(); render(); }));
document.querySelectorAll("#tabbar button").forEach(b =>
  b.addEventListener("click", () => { if(b.dataset.view === "drill") buildDeck(); go(b.dataset.view); }));
document.getElementById("backBtn").addEventListener("click", () => go("list"));
document.getElementById("sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("sheetWrap").hidden) closeSheet(); });

buildDeck();
render();
</script>
<script>
/* 서비스워커 — 오프라인 실행과 홈 화면 설치를 위한 최소 등록 */
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* 무시: 앱은 오프라인 없이도 동작한다 */ });
  });
}
</script>
</body>
